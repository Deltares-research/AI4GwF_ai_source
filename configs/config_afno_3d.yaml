arch:
  afno:
    img_shape: [16, 32, 32]
    patch_size: [2, 4, 4]
    embed_dim: 32
    depth: 2
    num_blocks: 4
    sparsity_threshold: 0.01
film:
  enabled: true
  hidden_dim: 64
batch_size:
  grid: 2
  validation: 2
optimizer:
  lr: 0.001
scheduler:
  decay_rate: 0.95
  decay_steps: 1000
training:
  max_steps: 1000
  rec_validation_freq: 100
custom:
  data:
    # Grids are volumes (N,D,H,W) or (N,C,D,H,W); replace example settings.
    files: [data/example_volume.h5]
    input_keys:
      - [permeability, 0.0, 100.0]
    scalar_keys:
      - [pumping_rate, 0.0, 1000.0]
    time_series_keys:
      - [rainfall_history, 0.0, 100.0]
    output_key: [head, -10.0, 10.0]
    train_fraction: 0.8
    seed: 42
  output:
    directory: outputs/afno_3d
    checkpoint_name: best.pt
    predictions_name: predictions.npz
    examples_to_plot: 4
